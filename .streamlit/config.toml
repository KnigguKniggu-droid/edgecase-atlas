[theme]
base = "dark"
primaryColor = "#1D4ED8"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#151C24"
textColor = "#F1F5F9"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "medium"
showWidgetBorder = true

[server]
headless = true
maxUploadSize = 1

[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

